[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ongdu-model-training"
version = "0.1.0"
description = "Local YOLO26 card detector training and verified ONNX Runtime inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
eval = ["ultralytics==8.4.197", "torch==2.8.0", "torchvision==0.23.0"]
train = ["ultralytics==8.4.197", "torch==2.8.0", "torchvision==0.23.0", "onnx==1.19.1", "onnxruntime==1.23.2", "onnxscript==0.5.6"]

[project.scripts]
ongdu-training = "ongdu_training.cli:main"

[tool.uv]
# Install the local src-layout package so uv run exposes ongdu-training.
package = true

[tool.setuptools.packages.find]
where = ["src"]
