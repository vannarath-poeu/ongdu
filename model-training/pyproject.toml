[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ongdu-model-training"
version = "0.1.0"
description = "Local, offline dataset tooling and scaffold for Ongdu model training"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Separate placeholder benchmark environment; training dependencies are still pending.
eval = ["ultralytics==8.3.240", "torch==2.8.0", "torchvision==0.23.0"]

[project.scripts]
ongdu-training = "ongdu_training.cli:main"

[tool.uv]
# Install the local src-layout package so uv run exposes ongdu-training.
package = true

[tool.setuptools.packages.find]
where = ["src"]
